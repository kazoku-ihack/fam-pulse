services:
  - type: web
    name: fam-pulse-api
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      # --- non-secret operational config (safe defaults for a public judge-facing demo) ---
      - key: DEMO_TIMESCALE
        value: "30"
      - key: ATTESTATION_MODE
        value: protosure # falls back to stub automatically if PROTOSURE_RATER_URL is unset/unreachable
      - key: ATTESTATION_FALLBACK
        value: stub
      - key: REGISTERED_SIGNER
        value: "0x2c7536e3605d9c16a7a3d7b1898e529396a65c23"
      - key: CHAIN_ID
        value: "43113"
      - key: SIM_CARE_REPLY
        value: "0"
      - key: SIM_FAIL_DISPATCH
        value: "0"
      - key: AUTO_RESET_MINUTES
        value: "30"
      - key: MAX_DEMO_TX_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: CORS_ORIGIN
        value: "*" # lock to your Mendix domains + Judge Console origin before demo day
      - key: FUJI_RPC
        value: https://api.avax-test.network/ext/bc/C/rpc
      - key: SEED_ON_BOOT
        value: "1" # free-tier disk is ephemeral — reseed every deploy/restart
      # --- secrets: fill in via the Render dashboard, never committed to git ---
      - key: API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: IMAP_URL
        sync: false
      - key: STUB_SIGNER_PRIVATE_KEY
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: JPYC_ADDR
        sync: false
      - key: PAYOUT_ADDR
        sync: false
      - key: PROTOSURE_RATER_URL
        sync: false
      - key: PROTOSURE_API_TOKEN
        sync: false
      - key: JUDGE_KEY
        sync: false
