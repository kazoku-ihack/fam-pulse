services:
  - type: web
    name: fam-pulse-api
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      # --- non-secret operational config (safe defaults for a public judge-facing demo) ---
      - key: DEMO_TIMESCALE
        value: "30"
      - key: ATTESTATION_MODE
        value: protosure # falls back to stub automatically if PROTOSURE_RATER_URL is unset/unreachable
      - key: ATTESTATION_FALLBACK
        value: stub
      - key: CHAIN_ID
        value: "43113"
      - key: SIM_CARE_REPLY
        value: "0"
      - key: SIM_FAIL_DISPATCH
        value: "0"
      - key: AUTO_RESET_MINUTES
        value: "30"
      - key: MAX_DEMO_TX_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: CORS_ORIGIN
        value: "*" # lock to your Mendix domains + Judge Console origin before demo day
      - key: FUJI_RPC
        value: https://api.avax-test.network/ext/bc/C/rpc
      - key: SEED_ON_BOOT
        value: "1" # free-tier disk is ephemeral — reseed every deploy/restart
      - key: ACTIVATION_MODE
        value: stub # falls back to stub automatically if PROTOSURE_BASE_URL is unset — flip to protosure once tenant creds are confirmed
      - key: ACTIVATION_MAX_ATTEMPTS
        value: "5"
      - key: ACTIVATION_LOCK_MINUTES
        value: "15"
      - key: ACTIVATION_TTL_MINUTES
        value: "15"
      # --- secrets: fill in via the Render dashboard, never committed to git ---
      - key: API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: IMAP_URL
        sync: false
      - key: STUB_SIGNER_PRIVATE_KEY
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: JPYC_ADDR
        sync: false
      - key: PAYOUT_ADDR
        sync: false
      - key: RIDER_ADDR
        sync: false # externally-deployed Rider contract — POST /v1/jpyc/transfer targets this instead of
                    # PAYOUT_ADDR for source:"protosure-direct" attestations (dual-sig submitTrigger)
      - key: ORACLE_SIGNER_PRIVATE_KEY
        sync: false # signs Rider's oracleSig at transfer time — required only for the protosure-direct flow
      - key: REGISTERED_SIGNER
        sync: false # tied 1:1 to whichever contract PAYOUT_ADDR points at — see JPYC_ADDR/PAYOUT_ADDR above.
                    # Was a hardcoded non-secret value here until 2026-07-29, when it drifted from
                    # what was actually registered on the live PAYOUT_ADDR contract and every
                    # signer check silently failed on Render until caught and fixed manually.
      - key: PROTOSURE_RATER_URL
        sync: false
      - key: PROTOSURE_USERNAME
        sync: false
      - key: PROTOSURE_PASSWORD
        sync: false
      - key: JUDGE_KEY
        sync: false
      - key: PROTOSURE_BASE_URL
        sync: false
      - key: PROTOSURE_API_TOKEN
        sync: false
      - key: DEVICE_TOKEN_SECRET
        sync: false
